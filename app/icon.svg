<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- NV monogram: graphite app-icon tile with a glass highlight, letters
       drawn as SF Pro Bold-style outlines so no font is needed. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d55"/>
      <stop offset="1" stop-color="#1c1d21"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14.5" fill="url(#tile)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="13.75" fill="url(#shine)" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
  <g fill="#fff">
    <path d="M11.5 45V19h5.7l7.9 13.6V19h5.4v26h-5.7l-7.9-13.6V45z"/>
    <path d="M32.5 19h5.9l4.1 18.6L46.6 19h5.9l-7 26h-6z"/>
  </g>
</svg>
